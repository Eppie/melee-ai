program: training_manager_wandb.py
method: bayes
metric:
  name: train/final_loss
  goal: minimize
parameters:
  model.bias:
    distribution: categorical
    values: [True, False]


command:
  - ${interpreter}
  - ${program}
  - --project
  - melee-ai
  - --entity
  - eppie-
  - --mode
  - online
  - --no-verbose
